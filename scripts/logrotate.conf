# Blogdex logrotate configuration
# Install with:
#   sudo cp scripts/logrotate.conf /etc/logrotate.d/blogdex
# Verify with:
#   sudo logrotate -d /etc/logrotate.d/blogdex

# ── daily_sync.py 로그 ──
/PATH/TO/BLOGDEX/logs/daily_sync.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644
}

# ── CLI 로그 (일별 파이프라인 로그) ──
/PATH/TO/BLOGDEX/cli/logs/daily_sync_*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 644
    maxage 180
}
