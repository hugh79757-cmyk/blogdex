name = "blogdex-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[build]
command = ""

# ⚠️ BLOGDEX_API_KEY must be set as a Worker secret before deployment:
#   npx wrangler secret put BLOGDEX_API_KEY
# Generate a key with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# This key must match the one used by CLI scripts (cli/.env or env export).

[[d1_databases]]
binding = "DB"
database_name = "blogdex_db"
database_id = "402564d6-83c0-4b49-ae76-a5caa5809c45"

